name: pdf_power_app
description: Advanced Full Offline PDF Editor - MuPDF + OCR powered
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # File & Storage (fully offline)
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  open_filex: ^4.5.0

  # PDF Viewing & Rendering
  pdfrx: ^1.0.88
  pdf: ^3.11.1
  printing: ^5.13.2

  # Image & Conversion helpers
  image: ^4.2.0
  flutter_image_compress: ^2.3.0

  # OCR (on-device via ML Kit - fully offline after model download)
  google_mlkit_text_recognition: ^0.13.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/icon.png"
