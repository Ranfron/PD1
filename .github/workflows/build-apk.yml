name: Build APK (arm64-v8a)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - name: List APKs
        run: find build -name "*.apk" -type f -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-power-apk-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
